name: build-cli
on:
  push:
    branches:
      - v2
  pull_request:
    branches:
      - v2
jobs:
  build-linux:
    strategy:
      fail-fast: false
      matrix:
        platform: [ 'amd64', 'arm64' ]
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v2
      - name: Configure QEMU
        uses: docker/setup-qemu-action@v3
      - name: Configure docker
        uses: docker/setup-buildx-action@v3
        with:
          platforms: ${{ matrix.platform }}
      - name: Expose GitHub Runtime
        uses: crazy-max/ghaction-github-runtime@v3
      - name: Build sources
        run: |
          docker buildx build --cache-to type=gha --cache-from type=gha --pull --load --platform linux/${{ matrix.platform }} --target cli-base-alpine -t builder .
      - name: Copy build
        run: |
          docker create --name builder builder
          docker cp builder:/go/src/app/cli/dist/dphp bin/dphp
      - name: Archive artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dphp-${{ runner.os }}-${{ matrix.platform }}
          path: bin/dphp
  build-osx:
    strategy:
      fail-fast: true
      matrix:
        platform: [ 'arm64', 'x86_64' ]
    runs-on: ${{ matrix.platform == 'arm64' && 'macos-14' || 'macos-13' }}
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '>=1.22'
      - name: Configure Version
        run: |
          if [ "${GITHUB_REF_TYPE}" == "tag" ]; then
            export VERSION=${GITHUB_REF_NAME:1}
          else
            export VERSION=${GITHUB_SHA}
          fi

          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"
      - name: Build php
        run: cli/build-php.sh
      - name: Build cli
        run: cd cli && ./build.sh
      - run: ls -lah cli/dist/
      - run: ls -lah dist/ || true
      - name: Archive artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dphp-${{ runner.os }}-${{ matrix.platfom }}
          path: cli/dist/dphp
