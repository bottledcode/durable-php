name: build-cli
on:
  push:
    branches:
      - v2
  pull_request:
    branches:
      - v2
jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Build php
        run: cli/build-php.sh
  build-osx:
    runs-on: macos-latest-large
    steps:
      - uses: actions/checkout@v2
      - name: build php
        run: cli/build-php.sh
