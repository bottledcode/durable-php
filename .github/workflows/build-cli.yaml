name: build-cli
on:
  push:
    branches:
      - v2
  pull_request:
    branches:
      - v2
jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Setup build cache
        uses: actions/cache@v4
        with:
          path: cli/dist/static-php-cli
          key: ${{runner.os}}-php-${{hashFiles('cli/*.mod')}}
          restore-keys: ${{runner.os}}-php-
      - name: Build php
        run: cd cli && ./build-php.sh
      - run: ls -lah dist/
      - name: Build cli
        run: cd cli && ./build.sh
  build-osx:
    runs-on: macos-latest-large
    steps:
      - uses: actions/checkout@v4
      - name: Setup build cache
        uses: actions/cache@v2
        with:
          path: cli/dist/static-php-cli
          key: ${{runner.os}}-php-${{hashFiles('cli/*.mod')}}
          restore-keys: ${{runner.os}}-php-
      - name: Build php
        run: cd cli && ./build-php.sh
      - run: ls -lah dist/
      - name: Build cli
        run: cd cli && ./build.sh
      - run: ls -lah dist/
